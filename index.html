<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Princess 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-rose-100 font-['Poppins'] min-h-screen overflow-x-hidden">

    <!-- STARTING WELCOME SCREEN (Stable Fixed Background) -->
    <div id="welcomeScreen" class="fixed inset-0 z-50 flex flex-col justify-between items-center text-center px-6 py-10 transition-opacity duration-1000">
        
        <!-- Stable Background Image Layer -->
        <div class="welcome-bg-layer"></div>

        <!-- Floating Petals Container over background -->
        <div class="hearts-container" id="heartsContainer"></div>

        <!-- Top Spacer -->
        <div></div>

        <!-- Center Content -->
        <div class="relative z-10 max-w-md w-full flex flex-col items-center">
            <div class="mb-3 text-rose-300 drop-shadow-[0_0_15px_rgba(244,63,94,0.8)]">
                <svg class="w-16 h-16 mx-auto" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L15 8L21 5L18 14H6L3 5L9 8L12 2Z" />
                    <circle cx="12" cy="11" r="1.5" fill="#fff"/>
                    <path d="M5 16H19V18H5V16Z" opacity="0.8"/>
                    <path d="M4 19H20V21H4V19Z" opacity="0.8"/>
                </svg>
            </div>

            <h1 class="font-['Great_Vibes'] text-6xl md:text-7xl text-rose-100 mb-2 drop-shadow-[0_0_20px_rgba(255,182,193,0.8)] tracking-wide">Princess</h1>
            
            <p class="font-['Cinzel'] italic text-rose-200/90 text-base md:text-lg tracking-wider mb-8 drop-shadow-md">
                A little world <br>made for you. ♡
            </p>
        </div>

        <!-- Enter Button -->
        <div class="relative z-10 w-full max-w-xs flex flex-col items-center pb-4">
            <button id="enterBtn" class="w-full py-4 px-8 rounded-full bg-gradient-to-r from-rose-950/90 via-rose-900/70 to-rose-950/90 border border-rose-400/50 text-rose-100 font-['Cinzel'] tracking-widest text-sm uppercase shadow-[0_0_25px_rgba(244,63,94,0.4)] hover:shadow-[0_0_35px_rgba(244,63,94,0.8)] hover:border-rose-300 transition-all duration-300 transform hover:scale-105 active:scale-95 backdrop-blur-md flex items-center justify-center gap-3 group">
                <span>Enter</span>
                <span class="group-hover:translate-x-1.5 transition-transform">→</span>
            </button>
            <div class="mt-4 text-rose-400/70 text-xs tracking-widest">♡ — ♡</div>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="mainContent" class="opacity-0 transition-opacity duration-1000 hidden pb-20">
        <header class="py-12 px-6 text-center relative">
            <div class="absolute top-6 right-6 flex items-center gap-2 bg-rose-950/40 border border-rose-500/30 px-3 py-1.5 rounded-full text-xs text-rose-300 backdrop-blur-md">
                <span id="nowPlayingText" class="truncate max-w-[150px]">Music Paused</span>
                <button id="musicToggleBtn" class="w-6 h-6 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs hover:bg-rose-500 transition-colors">🎵</button>
            </div>
            <h2 class="font-['Great_Vibes'] text-5xl text-rose-300 mb-2">Our Memory Vault</h2>
            <p class="text-xs text-rose-400/80 tracking-widest uppercase">Every moment with you is magic</p>
        </header>

        <main class="max-w-4xl mx-auto px-4 grid gap-8 md:grid-cols-2" id="blogsContainer">
            <!-- Dynamic blogs injected here -->
        </main>
    </div>

    <!-- SINGLE BLOG VIEW MODAL -->
    <div id="blogModal" class="fixed inset-0 z-40 bg-slate-950/90 backdrop-blur-lg hidden flex flex-col justify-between p-4 md:p-10 overflow-y-auto">
        <div class="max-w-2xl mx-auto w-full bg-slate-900/80 border border-rose-500/30 rounded-2xl p-6 md:p-8 shadow-2xl relative my-auto">
            <button id="closeModalBtn" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-rose-950/60 border border-rose-500/30 text-rose-300 flex items-center justify-center hover:bg-rose-900 transition-colors text-lg">✕</button>
            <span id="modalDate" class="text-xs font-semibold text-rose-400 tracking-widest uppercase block mb-1"></span>
            <h3 id="modalTitle" class="font-['Great_Vibes'] text-4xl text-rose-200 mb-4"></h3>
            <div id="modalImageContainer" class="mb-6 rounded-xl overflow-hidden border border-rose-500/20 shadow-lg">
                <img id="modalImage" src="" alt="Memory Image" class="w-full h-64 md:h-80 object-cover transform hover:scale-105 transition-transform duration-500">
            </div>
            <div id="modalText" class="text-slate-300 text-sm md:text-base leading-relaxed space-y-4 font-light"></div>
        </div>
    </div>

    <audio id="bgAudio" loop></audio>
    <script src="script.js"></script>
</body>
</html>
