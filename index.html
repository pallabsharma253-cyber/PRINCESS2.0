<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Princess 👑</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for romantic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-rose-100 font-['Poppins'] min-h-screen overflow-x-hidden">

    <!-- Floating Background Hearts Container -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- STARTING WELCOME SCREEN -->
    <div id="welcomeScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-rose-950 via-slate-950 to-purple-950 px-6 text-center transition-opacity duration-1000">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-rose-500/10 via-transparent to-transparent pointer-events-none"></div>
        <div class="relative z-10 max-w-md animate-pulse">
            <span class="text-rose-400 text-sm tracking-widest uppercase mb-2 block font-medium">A Special Journey For</span>
            <h1 class="font-['Great_Vibes'] text-6xl md:text-7xl text-rose-200 mb-6 drop-shadow-[0_0_15px_rgba(244,63,94,0.6)]">My Princess</h1>
            <p class="text-slate-300 text-sm md:text-base mb-8 leading-relaxed font-light">
                A little digital universe filled with our favorite memories, stories, and the melodies of our heart.
            </p>
            <button id="enterBtn" class="group relative inline-flex items-center gap-3 px-8 py-4 bg-gradient-to-r from-rose-600 to-pink-600 text-white rounded-full font-medium shadow-[0_0_30px_rgba(225,29,72,0.5)] hover:shadow-[0_0_40px_rgba(244,63,94,0.8)] transition-all duration-300 transform hover:scale-105 active:scale-95">
                <span>Enter Our World</span>
                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="mainContent" class="opacity-0 transition-opacity duration-1000 hidden pb-20">
        <!-- Header -->
        <header class="py-12 px-6 text-center relative">
            <div class="absolute top-6 right-6 flex items-center gap-2 bg-rose-950/40 border border-rose-500/30 px-3 py-1.5 rounded-full text-xs text-rose-300 backdrop-blur-md">
                <span id="nowPlayingText" class="truncate max-w-[150px]">Music Paused</span>
                <button id="musicToggleBtn" class="w-6 h-6 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs hover:bg-rose-500 transition-colors">🎵</button>
            </div>
            <h2 class="font-['Great_Vibes'] text-5xl text-rose-300 mb-2">Our Memory Vault</h2>
            <p class="text-xs text-rose-400/80 tracking-widest uppercase">Every moment with you is magic</p>
        </header>

        <!-- Blogs / Memories Grid Container -->
        <main class="max-w-4xl mx-auto px-4 grid gap-8 md:grid-cols-2" id="blogsContainer">
            <!-- Blogs will be injected dynamically from script.js -->
        </main>
    </div>

    <!-- SINGLE BLOG VIEW MODAL -->
    <div id="blogModal" class="fixed inset-0 z-40 bg-slate-950/90 backdrop-blur-lg hidden flex flex-col justify-between p-4 md:p-10 overflow-y-auto">
        <div class="max-w-2xl mx-auto w-full bg-slate-900/80 border border-rose-500/30 rounded-2xl p-6 md:p-8 shadow-2xl relative my-auto">
            <button id="closeModalBtn" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-rose-950/60 border border-rose-500/30 text-rose-300 flex items-center justify-center hover:bg-rose-900 transition-colors text-lg">✕</button>
            <span id="modalDate" class="text-xs font-semibold text-rose-400 tracking-widest uppercase block mb-1"></span>
            <h3 id="modalTitle" class="font-['Great_Vibes'] text-4xl text-rose-200 mb-4"></h3>
            <div id="modalImageContainer" class="mb-6 rounded-xl overflow-hidden border border-rose-500/20 shadow-lg">
                <img id="modalImage" src="" alt="Memory Image" class="w-full h-64 md:h-80 object-cover transform hover:scale-105 transition-transform duration-500">
            </div>
            <div id="modalText" class="text-slate-300 text-sm md:text-base leading-relaxed space-y-4 font-light"></div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="bgAudio" loop></audio>

    <script src="script.js"></script>
</body>
              </html>
